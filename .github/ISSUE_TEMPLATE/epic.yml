name: 🏛️ Epic
description: 複数Worktreeや中長期に渡る親課題の起票
title: "[Epic] "
labels: ["type:epic", "prio:p1-next", "size:L"]
body:
  - type: markdown
    attributes:
      value: |
        You_Inc の親課題（Epic）用テンプレートです。人間個人の単発行動（`[PREC-02]`）は独立 Issue にせず Epic の DoD ＆ Google Tasks へ配置してください。
  - type: textarea
    id: why
    attributes:
      label: 🎯 WHY & Value (背景と事業/システム価値)
      description: なぜこのEpicを立ち上げるのか？完了すると何がどう変わるか？
      placeholder: 背景と達成したい価値（Before ➔ After）
    validations:
      required: true
  - type: textarea
    id: what_dod
    attributes:
      label: 📋 WHAT / DoD (親Epic完了条件・クローズ条件)
      description: Epic全体の包括的な完了条件（人間マイルストーンはチェックリストに含め、実行は Google Tasks へ分離）
      placeholder: |
        - [ ] 子タスク/サブIssueの完了
        - [ ] アーキテクチャ正本への昇格
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: 🚫 Non-Scope (今回はやらないこと・境界)
      description: Epic肥大化を防ぐ境界線（未決なら着手時に確定）
      placeholder: 今回のEpicに含めない事項
    validations:
      required: false
  - type: textarea
    id: subtasks
    attributes:
      label: 🧱 Subtasks (想定されるサブタスク/Worktree分割案)
      description: 分割候補となるIssue案
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: false
