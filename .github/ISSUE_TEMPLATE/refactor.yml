name: 🧹 Refactor & Subtraction
description: 構造改善・不要コード削除・引き算整理の起票
title: "[Refactor] "
labels: ["type:refactor", "prio:p1-next", "size:M"]
body:
  - type: markdown
    attributes:
      value: |
        You_Inc の引き算（Delete ➔ Simplify ➔ Add）用 Issue テンプレートです。
  - type: textarea
    id: why
    attributes:
      label: 🎯 WHY (背景と負債の正体)
      description: どのような陳腐化・肥大化・技術的負債を解消するか？
      placeholder: 現状の負債と、削除・整理によるメリット
    validations:
      required: true
  - type: textarea
    id: what_dod
    attributes:
      label: 📋 WHAT / DoD (定量的完了条件・純減目標)
      description: 削除対象ファイル、純減行数目標、テスト通過条件
      placeholder: |
        - [ ] 対象ファイル・ディレクトリの削除
        - [ ] make check-all 通過 (Cov >= 90%)
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: 🚫 Non-Scope (今回は絶対にやらないこと)
      description: リファクタリング中の機能追加（足し算）を防止する境界線
      placeholder: 今回はスコープ外とする新規機能・仕様変更
    validations:
      required: true
  - type: textarea
    id: how_constraints
    attributes:
      label: 🛠️ HOW & CONSTRAINTS (想定アプローチと制約)
      description: 対象リポジトリ、互換性維持、移行手順
      placeholder: 削除手順・影響範囲
    validations:
      required: false
