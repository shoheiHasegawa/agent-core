name: 🧹 Refactor & Subtraction
description: 構造改善・不要コード削除・引き算整理の起票
title: "[Refactor] "
labels: ["type:refactor", "prio:p1-next", "size:M"]
body:
  - type: markdown
    attributes:
      value: |
        You_Inc の引き算（Delete ➔ Simplify ➔ Add）用 Issue テンプレートです。起票時に未確定の細部は捏造せず `TBD` と明記してください。
  - type: textarea
    id: why
    attributes:
      label: 🎯 WHY & Value (負債の正体と整理による価値)
      description: どのような陳腐化・肥大化を解消し、どんな保守性・シンプルさを獲得するか？
      placeholder: 現状の負債と、削除・整理による価値（Before ➔ After）
    validations:
      required: true
  - type: textarea
    id: what_dod
    attributes:
      label: 📋 WHAT / DoD (完了イメージと定量的完了条件)
      description: 削除対象、純減目標、テスト通過条件（未確定時は `TBD` と明記）
      placeholder: |
        - [ ] 対象ファイル・ディレクトリの削除
        - [ ] make check-all 通過 (Cov >= 90%)
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: 🚫 Non-Scope (今回はやらないこと・境界)
      description: リファクタリング中の足し算を防止する境界線（起票時に見えていれば記入）
      placeholder: 今回はスコープ外とする新規機能・仕様変更
    validations:
      required: false
  - type: textarea
    id: how_constraints
    attributes:
      label: 🛠️ CONSTRAINTS (対象リポジトリと互換性制約 ※詳細HOWは書かない)
      description: 対象リポジトリ、維持すべき互換性境界
      placeholder: 対象リポジトリ・維持すべき境界
    validations:
      required: false
